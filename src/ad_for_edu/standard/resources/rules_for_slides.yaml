  - id: visual_content_001
    section: "1.8"
    element: cross_cutting
    type: cross_cutting
    tag: PROV
    basis: operationalization-of
    rule: "VISUAL-CONTENT CONDITION (the second gate beside the redundancy gate): describe a moment only when a visual referent's FORM is needed to follow the lecturer's point and is not conveyed by speech. Form means one of: which element is meant, the shape or trend of a curve, the spatial arrangement of parts, relative magnitude, a count, a value read off the figure, or a colour code. The concept being spoken does not make the visual redundant; the slide existing does not make it describable; text has no form to describe. A moment with no visual referent, or whose form is already spoken, is not described."
    max_seconds: null
    citation: "Peng, Jang, Bigham & Pavel 2021, Say It All (CHI) — element-level coverage: image elements need description unless speech covers them, text elements are covered by being read · https://doi.org/10.1145/3411764.3445572"
    open_question: "OQ-VisualContent-1 :: added 2026-08-27 (v1.2) after the 60-item audit: 24 of 37 slide-type items flagged as having no pedagogically rich moment; the v1.1 standard had only a redundancy condition. Validated against the second-marker and the 40-item verdict check before it filters any rater item."
    bucket: needs_data
    validation: pending_second_marker_and_40_item_check
    scoring:
      route: unscored
      checks: []
      basis: audit_validated
      unscored_reason: decision_side
  - id: slide_text_003
    section: "2.SlideText"
    element: slide_text
    type: dont_describe
    tag: PROV
    basis: corollary-of
    rule: "On a slide whose only content is text (title, bullets, prose), the AD is at most one orientation line naming the slide's topic, given once when the slide first appears; never a paraphrase or summary of the bullets. If the lecturer reads or paraphrases the text, say nothing (slide_text_002)."
    max_seconds: null
    citation: "DCMP Description Key — What to Describe: on-screen text read by the speaker is not described · https://dcmp.org/learn/descriptionkey/617"
    open_question: "OQ-SlideText-3 :: added 2026-08-27 (v1.2). The observed failure: both sides of a pair paraphrasing the bullets of a text-only slide the lecturer was reading ('A slide notes each muscle is served by at least one motor nerve …')."
    bucket: needs_data
    validation: pending_second_marker_and_40_item_check
    scoring:
      route: penalty
      checks: [slide_copy_verbatim]
      basis: audit_validated
      unscored_reason: null
  - id: pair_perceptibility_001
    section: "1.9"
    element: cross_cutting
    type: cross_cutting
    tag: PROV
    basis: design-hypothesis
    rule: "A constructed defect in a preference pair must be perceptible to a listener: checkable against the speech, the named visual referent, or a stated form property. A perturbation of a slide-text token on a text-only moment (e.g. 'ten-fiber' inserted into a bullet paraphrase) is imperceptible by design and the pair is uninformative. Length defects must be audible overruns (the longer side at least 8 words and 1.4x the shorter, and over the rung budget), not marginal ones."
    max_seconds: null
    citation: null
    open_question: "OQ-Perceptibility-1 :: added 2026-08-27 (v1.2); operationalised per axis in analysis/pair_perceptibility.py. On the 60 rated items, pairs with |dwords| < 2.5 were flagged 25/44 against 0/16 above."
    bucket: needs_data
    validation: pending_second_marker_and_40_item_check
    scoring:
      route: unscored
      checks: []
      basis: audit_validated
      unscored_reason: pair_level

  - id: slide_text_001
    section: "2.SlideText"
    element: slide_text
    type: describe
    tag: DOC
    rule: "Read on-screen text central to comprehension that is not already conveyed by the lecturer's speech. This covers the slide title and any individual body item: surface only the specific uncovered item, gated by cross_cutting_001 — never read the slide top-to-bottom."
    max_seconds: 10
    citation: "W3C MAUR §1.8 · https://www.w3.org/TR/media-accessibility-reqs/"
    citation_extra:
      - "VideoA11y G30 · https://arxiv.org/html/2502.20480"
      - "Netflix v2.5 · https://partnerhelp.netflixstudios.com/hc/en-us/articles/215510667-Audio-Description-Style-Guide-v2-5"
    open_question: null
    scoring:
      route: judge
      checks: []
      basis: doc
      unscored_reason: null
