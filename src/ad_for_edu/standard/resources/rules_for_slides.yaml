  - id: edge_cases_001
    section: "Face.001"
    element: edge_cases
    type: dont_describe
    tag: PROV
    basis: transfer-from
    rule: "Do not describe the lecturer's face thumbnail — its presence, position, facial expressions, clothing, background, or appearance/disappearance; in this scope it is decoration and the speaker is already carried by the voice. If the lecturer explicitly directs attention to the webcam view (e.g. holds an object to the camera), treat it as an off-slide surface and describe it as such."
    max_seconds: null
    citation: "BY ANALOGY (not direct): WCAG Technique G203 · https://www.w3.org/WAI/WCAG21/Techniques/general/G203.html — a single speaker against an unchanging background carries no important time-based visual information warranting description. G203 addresses whole talking-head videos, not a picture-in-picture thumbnail over slides."
    rationale: "Coverage gap: face thumbnail as decoration. The slides-only scope introduces a persistent corner webcam thumbnail; without explicit suppression, a generator will narrate facial expressions and webcam events, spending gap budget on decoration."
    interaction: "Pure suppression: frees the length budget, never enters §3.5 collisions, and trivially satisfies the redundancy gate; the rare pedagogical-thumbnail case exits through that off-slide-surface exception rather than weakening the default."
    bucket: literature_now
    validation: source_citation
    open_question: "OQ-Face-1 : whether pedagogically meaningful thumbnail events (lecturer holds an object to the webcam) are frequent enough in footage to need a describe-path beyond the existing edge-case routing."
    scoring:
      route: judge
      checks: []
      basis: by_analogy
      unscored_reason: null
  - id: edge_cases_002
    section: "EdgeCases.001"
    element: edge_cases
    type: how
    tag: PROV
    basis: design-hypothesis
    rule: "When the lecturer zooms into, scrolls within, or otherwise reframes the shared slide, describe the content the new framing presents ('the lower-right quadrant of the diagram fills the screen: ...'), not the navigation mechanics; treat a sustained close-up on a region as deictic emphasis and resolve it per §2.Deixis. Name the region now shown rather than the camera-like move."
    max_seconds: 5
    citation: null
    rationale: "Coverage gap: screen-share reframing artifacts. Zooming and scrolling are routine in slides-only screencasts; wrong-window and off-slide surfaces are covered elsewhere, but not reframing of the slide surface itself."
    interaction: "Gated by cross_cutting_001 (already-described regions get a name-only re-anchor per cross_cutting_006); fits the 5 s budget; ranks with tier 5-6 in length_002 collisions unless the reframing is the lecturer's deictic target."
    bucket: needs_data
    validation: based_on_the_annotated_data
    open_question: "OQ-EdgeCases-1 : whether continuous scroll-through (a long document) needs a sampling rule — describe at scroll-rest only — pending footage frequency."
