  - id: deixis_005
    section: "Deixis.001"
    element: deixis
    type: how
    tag: PROV
    basis: design-hypothesis
    rule: "Resolve bare deictics ('this', 'here', 'this term') from the cursor's dwell anchor at utterance time: sustained dwell or deliberate circling over a slide region counts as a point; transit motion between regions is non-deictic (deixis_003). In this scope the cursor — with highlights and ink — is the only pointing modality, so an unanchored bare deictic resolves to silence (deixis_002)."
    max_seconds: 7
    citation: null
    rationale: "Coverage gap: cursor as the deictic surface. With no hand, laser, or body gesture available, the cursor is the sole carrier of 'this/here'; the deixis rules suppress idle cursor motion but do not state how a cursor point is recognized and bound to the spoken deictic."
    interaction: "Feeds the referent into deixis_001's surface form within the 7 s deixis budget; low-confidence anchors resolve to silence per cross_cutting_005; collisions retain deixis primacy (length_002)."
    bucket: needs_data
    validation: based_on_the_annotated_data
    open_question: "OQ-Deixis-1 : the minimum dwell duration separating a deliberate point from transit motion (threshold to be set from the annotated data)."
    scoring:
      route: mechanical
      checks: [deixis_referent]
      basis: blv_confirmed
      unscored_reason: null
    blv_review:
