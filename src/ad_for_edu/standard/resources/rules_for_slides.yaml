version: 1.6
date: 2026-06-14
scope: "Operative rule set for automated audio description of screencast-style slide-based lecture recordings."

rules:

  - id: cross_cutting_001
    section: "1.1"
    element: all
    type: cross_cutting
    tag: DOC
    rule: "REDUNDANCY GATE (governs every 'describe' rule in §2): describe on-screen content only to the extent the lecturer's speech does not already convey it. The element rules in §2 specify HOW to describe a figure/table/chart/equation/etc.; this rule decides WHETHER to, and how much — always only the gap the voice leaves. When the lecturer's words already carry the content, suppress entirely. This is a system for covering what speech omits, not for reading the screen aloud."
    max_seconds: null
    citation: "WCAG 2.2 Understanding 1.2.5 · https://www.w3.org/WAI/WCAG22/Understanding/audio-description-prerecorded.html"
    citation_extra:
      - "Mayer 2009 redundancy principle (SECONDARY) · https://sites.google.com/site/cognitivetheorymmlearning/redundancy-principle"
      - "DCMP Description Key §7 · https://dcmp.org/learn/618-description-key---what-to-describe"
    open_question: null
    scoring:
      route: mechanical
      checks: [nonredundancy_now]
      basis: doc
      unscored_reason: null
  - id: cross_cutting_002
    section: "1.2"
    element: all
    type: cross_cutting
    tag: DOC
    rule: "Use present tense, active voice, third-person narration. Refer to the pointer as the cursor or pointer, or to the person as the lecturer; never a gendered pronoun (he/she) -- the listener cannot see who is speaking."
    max_seconds: null
    citation: "DCMP Description Key §8 · https://dcmp.org/learn/617-description-key---how-to-describe"
    citation_extra:
      - "VideoA11y G3 · https://arxiv.org/html/2502.20480"
      - "Netflix v2.5 · https://partnerhelp.netflixstudios.com/hc/en-us/articles/215510667-Audio-Description-Style-Guide-v2-5"
    open_question: null
    scoring:
      route: mechanical
      checks: [style_meta, style_pronoun, style_v2]
      basis: doc
      unscored_reason: null
  - id: cross_cutting_003
    section: "1.3"
    element: all
    type: cross_cutting
    tag: DOC
    rule: "Describe observable visual content; do not infer emotions, intent, or significance."
    max_seconds: null
    citation: "DCMP Description Key §7 · https://dcmp.org/learn/618-description-key---what-to-describe"
    citation_extra:
      - "DCMP §8 · https://dcmp.org/learn/617-description-key---how-to-describe"
      - "VideoA11y G41 · https://arxiv.org/html/2502.20480"
    open_question: null
    scoring:
      route: judge
      checks: []
      basis: doc
      unscored_reason: null
  - id: cross_cutting_004
    section: "1.5"
    element: all
    type: cross_cutting
    tag: DOC
    rule: "Use consistent terminology within a lecture and across a course; adopt the lecturer's wording when terms are introduced."
    max_seconds: null
    citation: "DCMP Description Key §7 · https://dcmp.org/learn/618-description-key---what-to-describe"
    citation_extra:
      - "VideoA11y G22 · https://arxiv.org/html/2502.20480"
    open_question: null
    scoring:
      route: mechanical
      checks: [term_grounding]
      basis: doc
      unscored_reason: null
  - id: cross_cutting_005
    section: "1.8"
    element: all
    type: uncertainty
    tag: DOC
    rule: "When the AD system's confidence in what is on screen is low, prefer silence over a confident wrong description. A BLV student cannot verify a description; a wrong one is worse than silence."
    max_seconds: null
    citation: "Describe Now · https://arxiv.org/html/2411.11835v2 (S15.7)"
    open_question: null
    bucket: literature_now
    validation: source_citation
    scoring:
      route: mechanical
      checks: [faithfulness_nli]
      basis: doc
      unscored_reason: null
  - id: cross_cutting_006
    section: "1.10"
    element: all
    type: cross_cutting
    tag: DOC
    rule: "Do not re-describe visual content already described earlier in the same lecture. After first describing an element (a diagram, a definition, a figure), subsequent appearances within the same lecture get either a name-only reference or silence, not a full re-description."
    max_seconds: null
    citation: "WCAG 2.2 Understanding 1.2.5 · https://www.w3.org/WAI/WCAG22/Understanding/audio-description-prerecorded.html (S5.5)"
    citation_extra:
      - "Mayer 2009 redundancy principle (SECONDARY) · https://sites.google.com/site/cognitivetheorymmlearning/redundancy-principle (S12.1)"
      - "Sweller/Chandler split-attention effect (SECONDARY) · https://sites.google.com/site/cognitivetheorymmlearning/redundancy-principle (S12.5) — motivating rationale for consistent naming / no re-description, not proof for BLV lecture listeners (was cognitive_006)"
      - "Holsanova, Blomberg, Blomberg, Gardenfors & Johansson (2023), JAT 6(1):64-92 · https://doi.org/10.47476/jat.v6i1.2023.245 — AD at event boundaries is sensitive to spatiotemporal (time/location) circumstances; event-segmentation is an active AD-research area (film-AD; only an indirect analogy to lecture-scale re-description)"
    open_question: null
    bucket: literature_now
    validation: source_citation
    scoring:
      route: unscored
      checks: []
      basis: doc
      unscored_reason: no_context_signal
  - id: cross_cutting_007
    section: "1.10"
    element: all
    type: cross_cutting
    tag: PROV
    basis: design-hypothesis
    rule: "Lookahead redundancy (extends the redundancy gate cross_cutting_001 across time): suppress a description if the lecturer covers the same content shortly AFTER the visual event, not only simultaneously. OFFLINE dataset generation: look ahead over the transcript and suppress the description if the lecturer verbalizes the content within a window LOCKED to: before the next pedagogical event, or 45 seconds, whichever comes first. LIVE deployment: hold a non-urgent description for a brief grace window; if the lecturer begins covering it within the window, suppress, otherwise describe. Prevents the AD from pre-empting an explanation the lecturer is about to give (the covered-later case for reveals, equations, tables, figures)."
    max_seconds: null
    citation: null
    bucket: design_decision
    scoring:
      route: mechanical
      checks: [nonredundancy_ahead]
      basis: blv_confirmed
      unscored_reason: null
    blv_review:
      build: 6424ab12
      rules_sha: "42804e05d3ea"
      rules_version_reviewed: "1.1"
      question: "Is this rule right?"
      n_raters: 1
      verdicts:
        - rater: R1
          verdict: correct
          note: null
  - id: cross_cutting_008
    section: "1.11"
    element: all
    type: cross_cutting
    tag: DOC
    rule: "Describing the lecturer's gestures and board drawings — and resolving the deixis attached to them — is a core (not peripheral) lecture-AD task. The WCAG 1.2.7 physics-lecture example is the canonical case: a professor sketches rapidly on a whiteboard while gesturing and pauses are insufficient — the case proving gap-insertion alone fails. In a live system this is handled by the fallback ladder (length_003), not by pausing (WCAG 1.2.7 extended AD is prerecorded-only). The per-element machinery lives in §2.Deixis (rules deixis_001..006); this rule frames it as a first-class concern of lecture AD."
    max_seconds: null
    citation: "WCAG 2.2 Understanding 1.2.7 — extended AD physics-lecture example · https://www.w3.org/WAI/WCAG22/Understanding/extended-audio-description-prerecorded.html (S5.6)"
    open_question: null
    bucket: literature_now
    validation: source_citation
    scoring:
      route: unscored
      checks: []
      basis: doc
      unscored_reason: scope_statement

  - id: length_001
    section: "3.1"
    element: all
    type: length
    tag: DOC
    rule: "Gap-insertion is the base delivery mechanism: insert AD into existing pauses in the lecturer's speech."
    max_seconds: null
    citation: "WCAG 2.2 SC 1.2.5 · https://www.w3.org/TR/WCAG22/"
    open_question: null
    scoring:
      route: unscored
      checks: []
      basis: doc
      unscored_reason: delivery_mechanism
  - id: length_002
    section: "3.2"
    element: all
    type: length
    tag: PROV
    basis: design-hypothesis
    rule: "Live mode prioritization: deixis-resolution > slide-text gist > figure summary > full figure."
    max_seconds: null
    citation: null
    open_question: "OQ-Length-2 — RESOLVED: live priority LOCKED (deixis-resolution > slide-text gist > figure summary > full figure), implementing the deixis-first scheme. Basis: deixis primacy + drill-down (NCAM S4.G.4)."
    bucket: design_decision
    scoring:
      route: judge
      checks: []
      basis: blv_unresolved
      unscored_reason: null
    blv_review:
      build: 6424ab12
      rules_sha: "42804e05d3ea"
      rules_version_reviewed: "1.1"
      question: "Is this rule right?"
      n_raters: 1
      verdicts:
        - rater: R1
          verdict: cannot_tell
          note: "i need a concrete example."
  - id: length_003
    section: "3.2"
    element: all
    type: length
    tag: PROV
    basis: design-hypothesis
    rule: "Live fallback ladder (the live replacement for extended AD, which is unavailable because the live stream cannot be paused for the room). The BLV listener's audio is a per-user track, so it may run behind the live feed without affecting anyone else. When a describable visual cannot be conveyed in the available speech gap, descend until one rung succeeds: (1) full description if it fits the gap; (2) compressed description if a shorter gap fits; (3) time-shift — let the listener's track fall behind the live feed to deliver the full description, then catch up during the next pause (or by briefly faster playback), up to a maximum lag cap L (team-chosen, default ~20s); (4) honest placeholder naming what is on screen without faking coverage (e.g. 'equation on screen, long derivation in progress') when time-shift cannot keep up — lag would exceed L, or no upcoming pause exists to catch up in; (5) drop, only as a last resort. Collision-losers (two events competing for one gap) are out of scope for this standard. This ladder is the live replacement for every former per-element 'default to extended AD' instruction (figures, typeset math, ink writing, handwritten derivations). Tables and code keep their own element-specific compression and reference this ladder only for overflow."
    max_seconds: null
    citation: null
    open_question: "OQ-Length-6 :: lock ladder: time-shift committed; lag cap L=20s; catch-up pause-first then brief faster playback; placeholder wording as written. Basis: per-user track may lag without affecting the room (rule rationale); 20s ~ relevance/working-memory window [cite: length_005 rationale + §4 CLT]."
    bucket: design_decision
    scoring:
      route: mechanical
      checks: [rung_reachable]
      basis: blv_confirmed
      unscored_reason: null
    blv_review:
      build: 6424ab12
      rules_sha: "42804e05d3ea"
      rules_version_reviewed: "1.1"
      question: "Is this rule right?"
      n_raters: 1
      verdicts:
        - rater: R1
          verdict: correct
          note: null
  - id: length_004
    section: "3.3"
    element: all
    type: length
    tag: DOC
    rule: "Concise insertion default = 25 words; detailed override = 100 words."
    max_seconds: 10
    citation: "Describe Now · https://arxiv.org/html/2411.11835v2"
    citation_extra:
      - "Pavel, Reyes & Bigham (2020), Rescribe, UIST · arXiv:2010.03667 — auto-edits description length to fit gaps; residual: educational-content comprehension preservation untested"
    open_question: null
    scoring:
      route: mechanical
      checks: [length_budget]
      basis: doc
      unscored_reason: null
  - id: length_005
    section: "3.4"
    element: all
    type: length
    tag: PROV
    basis: transfer-from
    rule: "Avoid continuous description; leave silence on most lecturer-narrated stretches."
    max_seconds: null
    citation: null
    open_question: "OQ-Length-4 : avoid continuous description; silence on most narrated stretches (DCMP S1.H.8). "
    bucket: needs_data
