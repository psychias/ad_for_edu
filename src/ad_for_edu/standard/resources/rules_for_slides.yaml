  - id: deixis_006
    section: "Deixis.002"
    element: deixis
    type: how
    tag: PROV
    basis: corollary-of
    rule: "Treat highlight boxes, callout shapes, and colour emphasis drawn over a slide as deictic acts: surface the highlighted referent ('the boundary condition, u(0)=0'), not the overlay's appearance — describe colour, shape, or stroke only when it encodes meaning the lecturer relies on."
    max_seconds: 7
    citation: "BY ANALOGY (not direct): NCAM STEM overview S4.G.2 · https://www.wgbh.org/foundation/services/ncam/tools-resources/effective-practices-for-description-of-science-content-guidelines-for-describing-stem-images — 'Description should focus on the data and not extraneous visual elements'. NCAM addresses static STEM images and does not mention highlight or callout overlays."
    rationale: "Coverage gap: on-screen highlight/callout annotations. Highlights and callout boxes are a primary pointing modality of the slides-only scope; the deixis rules cover the cursor and pointing acts but do not classify drawn emphasis overlays as deixis."
    interaction: "Resolution follows deixis_001's surface form under the redundancy gate; styling suppression mirrors figure_004/chart_003; overflow descends the fallback ladder (length_005)."
