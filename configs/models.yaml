# The models the pipeline calls.
#
# A model holds only the roles listed for it:
#   classifier     decides what a candidate event is
#   writer         writes reference descriptions, candidates and controlled pairs
#   pair_judge     orders the pairs a system is trained on
#   metric_judge   scores descriptions as part of a metric
#   annotator      labels pairs for evaluation: the rated pool and the head-to-head draw
#
# No model is both pair_judge and metric_judge: a metric must not be asked whether it
# agrees with the labels it produced itself.
#
# Prices are list prices per million tokens and have to be kept current by hand.

providers:
  gemini:
    strategy: gemini_native
    credential_variable: GEMINI_API_KEY
    timeout_seconds: 120
    backoff_seconds: [30, 60, 120, 240, 480, 600, 600, 600]

  openrouter:
    strategy: openai_compatible
    base_url: https://openrouter.ai/api/v1
    credential_variable: OPENROUTER_API_KEY
    timeout_seconds: 120
    retry_waits: [2, 8, 20]
    limit_field: max_tokens

  # The same service, as the rating judges call it: many short calls side by side.
  openrouter_rating:
    strategy: openai_compatible
    base_url: https://openrouter.ai/api/v1
    credential_variable: OPENROUTER_API_KEY
    timeout_seconds: 120
    retry_waits: [2, 8, 20]
    limit_field: max_completion_tokens
    workers: 8

  local:
    strategy: huggingface_local
    template_marker: "[INST]"
    dtype: float16
    max_new_tokens: 8
    batch_size: 32
    device: "cuda:0"

models:
  gemini-3.1-pro:
    provider: gemini
    model_id: gemini-3.1-pro-preview
    modalities: [text, image, video]
    roles: [classifier, writer, pair_judge]
    price: {input: 2.00, output: 12.00}

  # The same model over the other service. It has no prompt cache there.
  gemini-3.1-pro-or:
    provider: openrouter
    model_id: google/gemini-3.1-pro-preview
    modalities: [text, image, video]
    roles: [classifier, writer, pair_judge]
    price: {input: 2.00, output: 12.00}

  gpt-5.5:
    provider: openrouter
    model_id: openai/gpt-5.5
    modalities: [text, image]
    roles: [writer, metric_judge]
    price: {input: 5.00, output: 30.00}

  claude-sonnet-4.6:
    provider: openrouter
    model_id: anthropic/claude-sonnet-4.6
    modalities: [text, image]
    roles: [writer]
    price: {input: 3.00, output: 15.00}

  qwen3-vl-235b:
    provider: openrouter
    model_id: qwen/qwen3-vl-235b-a22b-instruct
    modalities: [text, image]
    roles: [writer]
    price: {input: 0.21, output: 1.90}

  gpt-5.6-terra-pro:
    provider: openrouter
    model_id: openai/gpt-5.6-terra-pro
    modalities: [text, image]
    roles: [annotator]
    price: {input: 2.00, output: 12.00}

  claude-opus-5:
    provider: openrouter
    model_id: anthropic/claude-opus-5
    modalities: [text, image]
    roles: [annotator]
    price: {input: 5.00, output: 25.00}

  gpt-3.5-turbo:
    provider: openrouter_rating
    model_id: openai/gpt-3.5-turbo
    modalities: [text]
    roles: [metric_judge]
    price: {input: 0.50, output: 1.50}

  llama-2-7b-chat:
    provider: local
    model_id: meta-llama/Llama-2-7b-chat-hf
    modalities: [text]
    roles: [metric_judge]
